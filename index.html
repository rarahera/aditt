<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Booster</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">

    <!-- PAGE 1 -->
    <div class="page active" id="page1">
      <h1>ciyee... ada yang lagi badmood 😏</h1>
      <button id="btnSiapa">siapa ya?</button>
    </div>

    <!-- PAGE 2 -->
    <div class="page" id="page2">
      <h1>ternyata...</h1>
      <h2 id="namaText">Adit</h2>
      <p id="transformText"></p>
      <button id="btnNext">lanjut</button>
    </div>

    <!-- PAGE 3 -->
    <div class="page" id="page3">
      <h1>TIBA-TIBA!!! 🦖</h1>
      <div class="dino">🦖</div>
      <p>Adit berubah jadi T-Rex yang lagi marah 😡</p>
      <button id="btnCoklat">kasih coklat 🍫</button>
    </div>

    <!-- LOADING -->
    <div class="page" id="loadingPage">
      <h1>memberi coklat...</h1>
      <div class="loader"></div>
      <p id="loadingText">memproses mood stabilizer...</p>
    </div>

    <!-- FINAL -->
    <div class="page" id="pageFinal">
      <h1>YAYYY 😆</h1>
      <div class="happy">🥰✨</div>
      <p>Adit kembali normal dan senyum lagi</p>
      <p class="small">misi berhasil: bikin mood jadi lebih baik</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
